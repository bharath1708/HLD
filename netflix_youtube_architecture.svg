<svg width="100%" viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.teal{fill:#e0f2f1;stroke:#00897b;}
.purple{fill:#ede7f6;stroke:#5e35b1;}
.red{fill:#ffebee;stroke:#c62828;}
.gray{fill:#f5f5f5;stroke:#757575;}
.th{font-size:12px;font-weight:600;fill:#222;}
.ts{font-size:10px;fill:#444;}
.tn{font-size:9px;fill:#888;}
.arr{stroke:#555;stroke-width:1.4;fill:none;}
</style>
</defs>
<text class="th" x="360" y="20" text-anchor="middle" font-size="13">Video Streaming (Netflix/YouTube)</text>

<!-- WRITE / upload+encode -->
<text class="th" x="200" y="46" text-anchor="middle" fill="#5e35b1">WRITE — upload &amp; encode</text>
<rect class="gray" x="30" y="60" width="80" height="40" rx="8" stroke-width="1.2"/>
<text class="ts" x="70" y="84" text-anchor="middle">Creator</text>

<rect class="gray" x="150" y="58" width="120" height="44" rx="8" stroke-width="1.2"/>
<text class="ts" x="210" y="76" text-anchor="middle">S3 (raw upload)</text>
<text class="tn" x="210" y="90" text-anchor="middle">pre-signed URL</text>

<rect class="teal" x="310" y="58" width="90" height="44" rx="8" stroke-width="1.2"/>
<text class="ts" x="355" y="76" text-anchor="middle">encode queue</text>
<text class="tn" x="355" y="90" text-anchor="middle">(async)</text>

<rect class="purple" x="430" y="52" width="160" height="58" rx="8" stroke-width="1.2"/>
<text class="th" x="510" y="72" text-anchor="middle">Encoding workers</text>
<text class="ts" x="510" y="88" text-anchor="middle">240p-4K + chunk</text>
<text class="tn" x="510" y="100" text-anchor="middle">+ manifest (HLS/DASH)</text>

<rect class="gray" x="430" y="140" width="160" height="40" rx="8" stroke-width="1.2"/>
<text class="ts" x="510" y="164" text-anchor="middle">S3 (encoded chunks)</text>

<!-- CDN -->
<rect class="red" x="270" y="230" width="200" height="50" rx="8" stroke-width="1.2"/>
<text class="th" x="370" y="250" text-anchor="middle">CDN edge servers</text>
<text class="ts" x="370" y="266" text-anchor="middle">chunks cached near users (95% of design)</text>

<!-- READ / playback -->
<text class="th" x="200" y="330" text-anchor="middle" fill="#00897b">READ — playback</text>
<rect class="gray" x="30" y="345" width="90" height="44" rx="8" stroke-width="1.2"/>
<text class="ts" x="75" y="363" text-anchor="middle">Viewer (Tokyo)</text>
<text class="tn" x="75" y="378" text-anchor="middle">player</text>

<rect class="teal" x="160" y="345" width="150" height="44" rx="8" stroke-width="1.2"/>
<text class="ts" x="235" y="363" text-anchor="middle">nearest CDN edge</text>
<text class="tn" x="235" y="378" text-anchor="middle">manifest + chunks</text>

<!-- metadata -->
<rect class="gray" x="480" y="345" width="200" height="60" rx="8" stroke-width="1.2"/>
<text class="th" x="580" y="365" text-anchor="middle">Metadata service + DB</text>
<text class="ts" x="580" y="381" text-anchor="middle">title, views, comments</text>
<text class="tn" x="580" y="394" text-anchor="middle">SEPARATE from video bytes</text>

<line class="arr" x1="110" y1="80" x2="150" y2="80" marker-end="url(#ar)"/>
<line class="arr" x1="270" y1="80" x2="310" y2="80" marker-end="url(#ar)"/>
<text class="tn" x="290" y="52" text-anchor="middle">trigger</text>
<line class="arr" x1="400" y1="80" x2="430" y2="80" marker-end="url(#ar)"/>
<line class="arr" x1="510" y1="110" x2="510" y2="140" marker-end="url(#ar)"/>
<line class="arr" x1="490" y1="180" x2="420" y2="230" marker-end="url(#ar)"/>
<text class="tn" x="470" y="210" text-anchor="middle">distribute to edges</text>
<line class="arr" x1="235" y1="345" x2="330" y2="280" marker-end="url(#ar)"/>
<text class="tn" x="250" y="315" text-anchor="middle">stream chunks</text>
<line class="arr" x1="160" y1="367" x2="120" y2="367" marker-end="url(#ar)"/>
<text class="tn" x="140" y="358" text-anchor="middle">play</text>
<line class="arr" x1="310" y1="375" x2="480" y2="375" marker-end="url(#ar)" stroke-dasharray="3 3"/>
<text class="tn" x="400" y="368" text-anchor="middle">title/views (metadata)</text>

<text class="tn" x="360" y="440" text-anchor="middle">Adaptive bitrate: player fetches manifest, then requests each chunk at a resolution matching current bandwidth</text>
<text class="tn" x="360" y="456" text-anchor="middle">(good wifi → 1080p chunk, drops → 480p chunk) — possible because every chunk exists at every resolution.</text>
<text class="tn" x="360" y="478" text-anchor="middle">Playback position → Kafka → DB → resume across devices.  Video storage ≈ PETABYTES/day (raw × 5-7 resolutions).</text>
</svg>
