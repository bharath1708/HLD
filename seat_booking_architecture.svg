<svg width="100%" viewBox="0 0 740 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.teal{fill:#e0f2f1;stroke:#00897b;}
.purple{fill:#ede7f6;stroke:#5e35b1;}
.red{fill:#ffebee;stroke:#c62828;}
.amber{fill:#fff8e1;stroke:#f57f17;}
.green{fill:#e8f5e9;stroke:#2e7d32;}
.gray{fill:#f5f5f5;stroke:#757575;}
.th{font-size:12px;font-weight:600;fill:#222;}
.ts{font-size:10px;fill:#444;}
.tn{font-size:9px;fill:#888;}
.arr{stroke:#555;stroke-width:1.4;fill:none;}
.arrR{stroke:#A32D2D;stroke-width:1.4;fill:none;}
</style>
</defs>
<text class="th" x="370" y="20" text-anchor="middle" font-size="13">Seat / Ticket Booking — thundering herd + atomic hold</text>

<rect class="gray" x="30" y="55" width="80" height="38" rx="8" stroke-width="1.2"/>
<text class="ts" x="70" y="78" text-anchor="middle">100K users</text>

<rect class="amber" x="150" y="48" width="150" height="52" rx="8" stroke-width="1.2"/>
<text class="th" x="225" y="68" text-anchor="middle">Waiting Room</text>
<text class="ts" x="225" y="84" text-anchor="middle">Redis sorted set</text>
<text class="tn" x="225" y="96" text-anchor="middle">admit in batches (~1k/s)</text>

<rect class="gray" x="340" y="55" width="100" height="38" rx="8" stroke-width="1.2"/>
<text class="ts" x="390" y="78" text-anchor="middle">API Gateway</text>

<rect class="purple" x="300" y="130" width="160" height="46" rx="8" stroke-width="1.2"/>
<text class="th" x="380" y="150" text-anchor="middle">Booking Orchestrator</text>
<text class="tn" x="380" y="165" text-anchor="middle">saga + state machine</text>

<rect class="red" x="510" y="120" width="200" height="66" rx="8" stroke-width="1.2"/>
<text class="th" x="610" y="140" text-anchor="middle">Redis — live seat state</text>
<text class="ts" x="610" y="156" text-anchor="middle">event:{id}:seats  AVAIL/HELD/BOOKED</text>
<text class="tn" x="610" y="170" text-anchor="middle">atomic multi-seat claim (Lua) + TTL hold</text>
<text class="tn" x="610" y="181" text-anchor="middle">Pub/Sub → real-time seat map</text>

<rect class="teal" x="80" y="240" width="560" height="60" rx="10" stroke-width="1.2"/>
<text class="ts" x="610" y="270" text-anchor="middle">Kafka</text>
<rect class="gray" x="110" y="252" width="90" height="36" rx="6" stroke-width="0.8"/>
<text class="tn" x="155" y="273" text-anchor="middle">seat topic</text>
<rect class="gray" x="250" y="252" width="90" height="36" rx="6" stroke-width="0.8"/>
<text class="tn" x="295" y="273" text-anchor="middle">payment topic</text>
<rect class="gray" x="390" y="252" width="110" height="36" rx="6" stroke-width="0.8"/>
<text class="tn" x="445" y="273" text-anchor="middle">notification topic</text>

<rect class="gray" x="110" y="340" width="110" height="40" rx="8" stroke-width="1.2"/>
<text class="ts" x="165" y="364" text-anchor="middle">Seat service</text>
<rect class="gray" x="250" y="340" width="110" height="40" rx="8" stroke-width="1.2"/>
<text class="ts" x="305" y="364" text-anchor="middle">Payment service</text>
<rect class="gray" x="390" y="340" width="120" height="40" rx="8" stroke-width="1.2"/>
<text class="ts" x="450" y="364" text-anchor="middle">Notification svc</text>

<rect class="gray" x="250" y="430" width="140" height="46" rx="8" stroke-width="1.2"/>
<text class="ts" x="320" y="450" text-anchor="middle">Booking DB</text>
<text class="tn" x="320" y="464" text-anchor="middle">durable: BOOKED only</text>

<rect class="gray" x="530" y="220" width="120" height="40" rx="8" stroke-width="1.2"/>
<text class="tn" x="590" y="244" text-anchor="middle">Orchestrator DB</text>

<line class="arr" x1="110" y1="74" x2="150" y2="74" marker-end="url(#ar)"/>
<line class="arr" x1="300" y1="74" x2="340" y2="74" marker-end="url(#ar)"/>
<text class="tn" x="320" y="45" text-anchor="middle">admitted</text>
<line class="arr" x1="390" y1="93" x2="385" y2="130" marker-end="url(#ar)"/>
<line class="arr" x1="460" y1="150" x2="510" y2="150" marker-end="url(#ar)"/>
<text class="tn" x="485" y="128" text-anchor="middle">1. atomic HOLD</text>
<line class="arr" x1="460" y1="168" x2="530" y2="230" marker-end="url(#ar)"/>
<line class="arr" x1="380" y1="176" x2="300" y2="240" marker-end="url(#ar)"/>
<text class="tn" x="300" y="215" text-anchor="middle">2. async: pay/notify</text>
<line class="arr" x1="155" y1="288" x2="165" y2="340" marker-end="url(#ar)"/>
<line class="arr" x1="295" y1="288" x2="305" y2="340" marker-end="url(#ar)"/>
<line class="arr" x1="445" y1="288" x2="450" y2="340" marker-end="url(#ar)"/>
<line class="arr" x1="305" y1="380" x2="315" y2="430" marker-end="url(#ar)"/>
<text class="tn" x="360" y="410" text-anchor="middle">3. confirm → BOOKED</text>

<text class="tn" x="370" y="505" text-anchor="middle">Flow: waiting room absorbs spike → admit in batches → atomic multi-seat HOLD in Redis (TTL) → async payment (Kafka saga)</text>
<text class="tn" x="370" y="521" text-anchor="middle">→ success: mark BOOKED in Redis + write durable booking to DB → notify.  Fail/TTL expiry: hold auto-releases → AVAILABLE.</text>
<text class="tn" x="370" y="541" text-anchor="middle">Redis = live/hot seat state (fast, atomic, TTL). DB = durable source of truth for BOOKED. On Redis loss → rebuild from DB.</text>
</svg>
