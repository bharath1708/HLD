<svg width="100%" viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.teal{fill:#e0f2f1;stroke:#00897b;}
.purple{fill:#ede7f6;stroke:#5e35b1;}
.red{fill:#ffebee;stroke:#c62828;}
.gray{fill:#f5f5f5;stroke:#757575;}
.th{font-size:12px;font-weight:600;fill:#222;}
.ts{font-size:10px;fill:#444;}
.arr{stroke:#555;stroke-width:1.4;fill:none;}
.arrR{stroke:#A32D2D;stroke-width:1.4;fill:none;}
.note{font-size:9px;fill:#888;}
</style>
</defs>

<rect class="gray" x="30" y="30" width="110" height="36" rx="8" stroke-width="1.2"/>
<text class="ts" x="85" y="52" text-anchor="middle">Client / LB</text>

<rect class="purple" x="250" y="24" width="180" height="52" rx="8" stroke-width="1.2"/>
<text class="th" x="340" y="44" text-anchor="middle">Order Manager</text>
<text class="ts" x="340" y="61" text-anchor="middle">saga orchestrator + state machine</text>

<rect class="teal" x="60" y="150" width="150" height="50" rx="8" stroke-width="1.2"/>
<text class="th" x="135" y="169" text-anchor="middle">Inventory service</text>
<text class="ts" x="135" y="186" text-anchor="middle">atomic reserve (CP), TTL hold</text>

<rect class="teal" x="270" y="150" width="140" height="50" rx="8" stroke-width="1.2"/>
<text class="th" x="340" y="169" text-anchor="middle">Payment service</text>
<text class="ts" x="340" y="186" text-anchor="middle">charge / refund</text>

<rect class="gray" x="470" y="150" width="120" height="50" rx="8" stroke-width="1.2"/>
<text class="ts" x="530" y="169" text-anchor="middle">orders DB</text>
<text class="ts" x="530" y="186" text-anchor="middle">+ outbox table</text>

<rect class="teal" x="470" y="240" width="120" height="36" rx="8" stroke-width="1.2"/>
<text class="ts" x="530" y="262" text-anchor="middle">relay → Kafka</text>

<rect class="teal" x="250" y="320" width="180" height="40" rx="8" stroke-width="1.2"/>
<text class="ts" x="340" y="344" text-anchor="middle">Fulfillment service</text>

<rect class="gray" x="180" y="400" width="110" height="34" rx="8" stroke-width="1.2"/>
<text class="ts" x="235" y="421" text-anchor="middle">Shipping</text>
<rect class="gray" x="320" y="400" width="110" height="34" rx="8" stroke-width="1.2"/>
<text class="ts" x="375" y="421" text-anchor="middle">Delivery</text>

<line class="arr" x1="140" y1="48" x2="250" y2="48" marker-end="url(#ar)"/>
<line class="arr" x1="300" y1="76" x2="180" y2="150" marker-end="url(#ar)"/>
<text class="note" x="185" y="120" text-anchor="middle">1. reserve</text>
<line class="arr" x1="340" y1="76" x2="340" y2="150" marker-end="url(#ar)"/>
<text class="note" x="375" y="120" text-anchor="middle">2. charge</text>
<line class="arrR" x1="200" y1="150" x2="300" y2="80" marker-end="url(#arR)"/>
<text class="note" x="215" y="145" text-anchor="middle" fill="#A32D2D">compensate: release</text>
<line class="arr" x1="430" y1="60" x2="470" y2="155" marker-end="url(#ar)"/>
<text class="note" x="470" y="110" text-anchor="middle">3. persist + outbox</text>
<line class="arr" x1="530" y1="200" x2="530" y2="240" marker-end="url(#ar)"/>
<line class="arr" x1="510" y1="276" x2="410" y2="325" marker-end="url(#ar)"/>
<line class="arr" x1="320" y1="360" x2="250" y2="400" marker-end="url(#ar)"/>
<line class="arr" x1="360" y1="360" x2="375" y2="400" marker-end="url(#ar)"/>

<text class="note" x="620" y="300" text-anchor="middle">outbox → relay →</text>
<text class="note" x="620" y="313" text-anchor="middle">Kafka → fulfillment</text>
</svg>
