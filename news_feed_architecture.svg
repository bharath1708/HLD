<svg width="100%" viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.teal{fill:#e0f2f1;stroke:#00897b;}
.purple{fill:#ede7f6;stroke:#5e35b1;}
.red{fill:#ffebee;stroke:#c62828;}
.gray{fill:#f5f5f5;stroke:#757575;}
.th{font-size:12px;font-weight:600;fill:#222;}
.ts{font-size:10px;fill:#444;}
.tn{font-size:9px;fill:#888;}
.arr{stroke:#555;stroke-width:1.4;fill:none;}
</style>
</defs>
<text class="th" x="360" y="20" text-anchor="middle" font-size="13">News Feed — hybrid fan-out</text>

<!-- WRITE side -->
<text class="th" x="180" y="48" text-anchor="middle" fill="#5e35b1">WRITE (post created)</text>
<rect class="gray" x="30" y="60" width="80" height="38" rx="8" stroke-width="1.2"/>
<text class="ts" x="70" y="83" text-anchor="middle">User posts</text>

<rect class="purple" x="150" y="55" width="130" height="48" rx="8" stroke-width="1.2"/>
<text class="th" x="215" y="74" text-anchor="middle">Post service</text>
<text class="ts" x="215" y="89" text-anchor="middle">persist post</text>

<rect class="gray" x="320" y="55" width="110" height="48" rx="8" stroke-width="1.2"/>
<text class="ts" x="375" y="74" text-anchor="middle">posts DB</text>
<text class="ts" x="375" y="89" text-anchor="middle">+ S3 for files</text>

<rect class="purple" x="150" y="140" width="130" height="56" rx="8" stroke-width="1.2"/>
<text class="th" x="215" y="162" text-anchor="middle">Fan-out service</text>
<text class="ts" x="215" y="179" text-anchor="middle">normal user only</text>

<rect class="red" x="320" y="140" width="150" height="56" rx="8" stroke-width="1.2"/>
<text class="th" x="395" y="162" text-anchor="middle">Redis feed cache</text>
<text class="ts" x="395" y="178" text-anchor="middle">feed:{user} (capped)</text>

<rect class="gray" x="510" y="140" width="150" height="56" rx="8" stroke-width="1.2"/>
<text class="ts" x="585" y="162" text-anchor="middle">celebrity? SKIP</text>
<text class="tn" x="585" y="178" text-anchor="middle">pulled at read time</text>

<!-- READ side -->
<text class="th" x="360" y="270" text-anchor="middle" fill="#00897b">READ (open feed)</text>
<rect class="gray" x="30" y="300" width="80" height="38" rx="8" stroke-width="1.2"/>
<text class="ts" x="70" y="323" text-anchor="middle">Open app</text>

<rect class="purple" x="150" y="295" width="130" height="50" rx="8" stroke-width="1.2"/>
<text class="th" x="215" y="315" text-anchor="middle">Feed service</text>
<text class="ts" x="215" y="331" text-anchor="middle">merge + sort</text>

<rect class="red" x="320" y="285" width="150" height="34" rx="8" stroke-width="1.2"/>
<text class="ts" x="395" y="305" text-anchor="middle">precomputed feed (Redis)</text>
<rect class="gray" x="320" y="330" width="150" height="34" rx="8" stroke-width="1.2"/>
<text class="ts" x="395" y="350" text-anchor="middle">live pull: celebrities</text>

<line class="arr" x1="110" y1="79" x2="150" y2="79" marker-end="url(#ar)"/>
<line class="arr" x1="280" y1="79" x2="320" y2="79" marker-end="url(#ar)"/>
<line class="arr" x1="215" y1="103" x2="215" y2="140" marker-end="url(#ar)"/>
<text class="tn" x="255" y="125" text-anchor="middle">async fan-out</text>
<line class="arr" x1="280" y1="168" x2="320" y2="168" marker-end="url(#ar)"/>
<text class="tn" x="300" y="132" text-anchor="middle">push to followers' feeds</text>
<line class="arr" x1="470" y1="168" x2="510" y2="168" marker-end="url(#ar)"/>

<line class="arr" x1="110" y1="319" x2="150" y2="319" marker-end="url(#ar)"/>
<line class="arr" x1="280" y1="310" x2="320" y2="302" marker-end="url(#ar)"/>
<text class="tn" x="300" y="288" text-anchor="middle">read precomputed</text>
<line class="arr" x1="280" y1="325" x2="320" y2="345" marker-end="url(#ar)"/>
<text class="tn" x="300" y="372" text-anchor="middle">+ pull celebrity posts</text>

<text class="tn" x="360" y="410" text-anchor="middle">Feed open = read precomputed feed (fan-out-on-write, normal users) + live-pull celebrity posts + MERGE + sort by time</text>
<text class="tn" x="360" y="428" text-anchor="middle">Normal users → push at write. Celebrities (&gt; threshold followers) → pull at read (avoids the write storm).</text>
<text class="tn" x="360" y="446" text-anchor="middle">Read-heavy ~100:1 → that's WHY fan-out-on-write exists (pay at write, cheap reads).</text>
</svg>
